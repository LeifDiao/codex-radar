<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Radar · Collaboration Report</title>
<style>
  /* ── Shared tokens (all themes) ── */
  :root {
    --grade-s: #16a34a; --grade-a: #2563eb; --grade-b: #ca8a04; --grade-c: #ea580c; --grade-d: #dc2626;
    --grade-s-bg: rgba(34,197,94,0.12); --grade-a-bg: rgba(59,130,246,0.12);
    --grade-b-bg: rgba(234,179,8,0.14); --grade-c-bg: rgba(249,115,22,0.12); --grade-d-bg: rgba(239,68,68,0.12);
    --good: #16a34a; --bad: #dc2626;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --grade-s: #4ade80; --grade-a: #60a5fa; --grade-b: #facc15; --grade-c: #fb923c; --grade-d: #f87171;
      --good: #4ade80; --bad: #f87171;
    }
  }

  /* ── Theme: ink 墨绿纸感 — warm paper + deep green ── */
  :root {
    --bg-0: #f4f4ef; --bg-1: #fbfaf7; --bg-2: #eeede4; --bg-3: #e2e1d5;
    --text-1: #1a1a15; --text-2: #42423a; --text-3: #6f6f64; --text-4: #96968a; --text-5: #b9b9ac;
    --border-1: rgba(30, 30, 15, 0.07); --border-2: rgba(30, 30, 15, 0.12);
    --accent: #047857; --accent-ink: #065f46;
    --accent-soft: rgba(4, 120, 87, 0.08); --accent-soft-strong: rgba(4, 120, 87, 0.20);
    --cat-comm: #047857; --cat-eng: #1d4ed8; --cat-out: #b45309;
    --shadow-card: 0 1px 2px rgba(35, 35, 15, 0.04), 0 6px 24px rgba(35, 35, 15, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-0: #0c110f; --bg-1: #131a17; --bg-2: #1a221e; --bg-3: #24302a;
      --text-1: #f0f4f1; --text-2: #cbd4ce; --text-3: #94a29a; --text-4: #67746d; --text-5: #45514a;
      --border-1: rgba(230, 255, 240, 0.06); --border-2: rgba(230, 255, 240, 0.10);
      --accent: #059669; --accent-ink: #34d399;
      --accent-soft: rgba(16, 185, 129, 0.12); --accent-soft-strong: rgba(16, 185, 129, 0.26);
      --cat-comm: #059669; --cat-eng: #3b82f6; --cat-out: #d97706;
      --shadow-card: 0 1px 2px rgba(0,0,0,0.35), 0 6px 24px rgba(0,0,0,0.25);
    }
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg-0);
    color: var(--text-1);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* ═══ Topbar ═══ */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in srgb, var(--bg-0) 82%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-1);
  }
  .topbar-inner {
    max-width: 920px; margin: 0 auto;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 28px;
  }
  .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; }
  .brand svg { width: 20px; height: 20px; color: var(--accent); }
  .brand-name { font-size: 13px; font-weight: 700; letter-spacing: -0.2px; }
  .topbar-project {
    font-size: 12px; color: var(--text-4);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .topbar-project strong { color: var(--text-2); font-weight: 600; }
  .topnav { margin-left: auto; display: flex; gap: 2px; }
  .topnav a {
    font-size: 12px; font-weight: 500; color: var(--text-3);
    text-decoration: none; padding: 5px 10px; border-radius: 7px;
    white-space: nowrap;
  }
  .topnav a:hover { background: var(--bg-2); color: var(--text-1); }
  .topnav a.active { color: var(--accent-ink); background: var(--accent-soft); font-weight: 600; }
  .lang-btn {
    font-size: 11px; font-weight: 600; font-family: inherit;
    color: var(--text-3); background: transparent;
    border: 1px solid var(--border-2); border-radius: 7px;
    padding: 4px 10px; cursor: pointer;
  }
  .lang-btn:hover { color: var(--accent-ink); border-color: var(--accent); }

  /* ═══ Page ═══ */
  .page { max-width: 920px; margin: 0 auto; padding: 40px 28px 90px; }
  .section { margin-bottom: 64px; scroll-margin-top: 70px; }
  .section-head {
    display: flex; align-items: baseline; gap: 14px;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-1);
  }
  .section-kicker {
    font-size: 11px; font-weight: 800; letter-spacing: 2px;
    text-transform: uppercase; color: var(--accent-ink);
  }
  .section-title { font-size: 19px; font-weight: 750; letter-spacing: -0.3px; }
  .section-hint { margin-left: auto; font-size: 11.5px; color: var(--text-4); }

  /* ═══ Hero ═══ */
  .hero {
    display: grid; grid-template-columns: 1fr 310px;
    gap: 40px; align-items: center;
    background: var(--bg-1);
    border: 1px solid var(--border-2);
    border-radius: 20px;
    box-shadow: var(--shadow-card);
    padding: 36px 40px;
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 90% at 85% 10%, var(--accent-soft), transparent 70%);
    pointer-events: none;
  }
  .profile-badge {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 12px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent-ink);
    font-size: 11px; font-weight: 700; letter-spacing: 0.4px;
    margin-bottom: 16px;
  }
  .profile-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .insight {
    font-size: 27px; font-weight: 650; line-height: 1.38;
    letter-spacing: -0.5px; margin: 0 0 20px;
    color: var(--text-1); max-width: 480px;
  }
  .verdict-row { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; }
  .grade-letter {
    font-size: 64px; font-weight: 800; line-height: 0.95; letter-spacing: -3px;
  }
  .grade-letter[data-grade="S"] { color: var(--grade-s); }
  .grade-letter[data-grade="A"] { color: var(--grade-a); }
  .grade-letter[data-grade="B"] { color: var(--grade-b); }
  .grade-letter[data-grade="C"] { color: var(--grade-c); }
  .grade-letter[data-grade="D"] { color: var(--grade-d); }
  .verdict-detail { display: flex; flex-direction: column; gap: 2px; }
  .verdict-score { font-size: 15px; font-weight: 700; color: var(--text-1); }
  .verdict-score .of { color: var(--text-4); font-weight: 500; }
  .verdict-label {
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: var(--text-3);
  }
  .trend-chip {
    margin-left: 10px; padding-left: 18px; border-left: 1px solid var(--border-2);
    display: flex; flex-direction: column; gap: 3px;
  }
  .trend-chip svg { display: block; }
  .trend-chip .trend-note { font-size: 10.5px; color: var(--text-4); }
  .meta-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .meta-chip {
    font-size: 11px; color: var(--text-3);
    background: var(--bg-2); border-radius: 6px;
    padding: 3.5px 9px;
  }
  .hero-radar { position: relative; z-index: 1; }
  .hero-radar svg { width: 100%; height: auto; display: block; }
  .radar-grid { stroke: var(--border-2); fill: none; stroke-width: 1; }
  .radar-axis { stroke: var(--border-1); stroke-width: 1; }
  .radar-shape { fill: var(--accent); fill-opacity: 0.13; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  .radar-dot { fill: var(--accent); stroke: var(--bg-1); stroke-width: 2; cursor: pointer; }
  .radar-dot.na { fill: var(--bg-1); stroke: var(--text-5); stroke-width: 1.5; }
  .radar-label { font-size: 10px; fill: var(--text-3); font-weight: 600; }
  .radar-label.na { fill: var(--text-5); font-weight: 500; }
  .radar-tick { font-size: 8px; fill: var(--text-5); }
  .radar-tip {
    position: fixed; z-index: 90; pointer-events: none;
    background: var(--text-1); color: var(--bg-1);
    font-size: 11px; font-weight: 600;
    padding: 5px 10px; border-radius: 7px;
    transform: translate(-50%, calc(-100% - 10px));
    white-space: nowrap; opacity: 0; transition: opacity 0.12s ease;
  }
  .radar-tip .tip-score { font-weight: 800; }

  /* ═══ Banner ═══ */
  .banner {
    border: 1px solid rgba(234,179,8,0.35); background: rgba(234,179,8,0.08);
    border-radius: 12px; padding: 12px 16px; margin-bottom: 22px;
    font-size: 12.5px; color: var(--text-2); line-height: 1.6;
  }
  .banner strong { color: var(--grade-b); }
  .banner ul { margin: 4px 0 0 18px; padding: 0; }

  /* ═══ Key reads ═══ */
  .pull-quote {
    background: var(--bg-1);
    border: 1px solid var(--border-2);
    border-left: 3px solid var(--accent);
    border-radius: 14px;
    box-shadow: var(--shadow-card);
    padding: 26px 30px;
    font-size: 17px; line-height: 1.75; color: var(--text-1);
    margin-bottom: 14px;
  }
  .pull-quote strong { color: var(--accent-ink); font-weight: 750; }
  .pull-quote .pq-label {
    display: block; font-size: 10.5px; font-weight: 800; letter-spacing: 1.6px;
    text-transform: uppercase; color: var(--text-4); margin-bottom: 10px;
  }
  .reads-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .read-card {
    background: var(--bg-1); border: 1px solid var(--border-2);
    border-radius: 14px; padding: 20px 22px;
    box-shadow: var(--shadow-card);
    cursor: pointer;
  }
  .read-card:hover { border-color: var(--accent-soft-strong); }
  .read-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .read-kicker {
    font-size: 10.5px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase;
  }
  .read-card.strength .read-kicker { color: var(--good); }
  .read-card.bottleneck .read-kicker { color: var(--bad); }
  .read-dim {
    margin-left: auto; display: inline-flex; align-items: center; gap: 7px;
    font-size: 11.5px; font-weight: 600; color: var(--text-3);
  }
  .score-chip {
    font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 6px;
    font-variant-numeric: tabular-nums;
  }
  .score-chip[data-grade="S"] { color: var(--grade-s); background: var(--grade-s-bg); }
  .score-chip[data-grade="A"] { color: var(--grade-a); background: var(--grade-a-bg); }
  .score-chip[data-grade="B"] { color: var(--grade-b); background: var(--grade-b-bg); }
  .score-chip[data-grade="C"] { color: var(--grade-c); background: var(--grade-c-bg); }
  .score-chip[data-grade="D"] { color: var(--grade-d); background: var(--grade-d-bg); }
  .read-headline { font-size: 14px; font-weight: 600; line-height: 1.6; color: var(--text-1); }
  .cross-strip {
    font-size: 13px; line-height: 1.7; color: var(--text-2);
    background: var(--bg-2); border-radius: 12px;
    padding: 14px 20px; font-style: italic;
    margin-bottom: 14px;
  }
  .cross-strip::before { content: "◈ "; color: var(--accent); font-style: normal; }
  details.profile-fold {
    border: 1px solid var(--border-1); border-radius: 12px;
    background: var(--bg-1);
  }
  details.profile-fold summary {
    list-style: none; cursor: pointer;
    padding: 12px 20px;
    font-size: 12px; font-weight: 700; color: var(--text-3);
    display: flex; align-items: center; gap: 8px;
  }
  details.profile-fold summary::-webkit-details-marker { display: none; }
  details.profile-fold summary::after { content: "＋"; margin-left: auto; color: var(--text-4); font-weight: 500; }
  details.profile-fold[open] summary::after { content: "－"; }
  details.profile-fold .fold-body { padding: 0 20px 18px; font-size: 13.5px; line-height: 1.8; color: var(--text-2); }

  /* ═══ Action plan ═══ */
  .focus-card {
    background: var(--bg-1);
    border: 1px solid var(--accent-soft-strong);
    border-radius: 16px;
    box-shadow: var(--shadow-card), 0 0 0 4px var(--accent-soft);
    padding: 26px 30px;
    margin-bottom: 22px;
    position: relative;
  }
  .focus-flag {
    position: absolute; top: -11px; left: 24px;
    background: var(--accent); color: #fff;
    font-size: 10.5px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;
    padding: 3px 12px; border-radius: 999px;
  }
  .sugg-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .focus-card .sugg-head { margin-top: 6px; }
  .sugg-title { font-size: 17px; font-weight: 750; letter-spacing: -0.2px; color: var(--text-1); flex-basis: 100%; margin-top: 2px; }
  .focus-card .sugg-title { font-size: 20px; }
  .pill {
    font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
    padding: 3px 9px; border-radius: 6px; white-space: nowrap;
  }
  .pill-high { background: var(--grade-d-bg); color: var(--grade-d); }
  .pill-medium { background: var(--grade-b-bg); color: var(--grade-b); }
  .pill-low { background: var(--bg-3); color: var(--text-3); }
  .pill-type { background: var(--accent-soft); color: var(--accent-ink); }
  .pill-dim { background: var(--bg-3); color: var(--text-3); font-weight: 600; text-transform: none; letter-spacing: 0.2px; }
  .sugg-body { font-size: 14px; line-height: 1.75; color: var(--text-2); margin: 6px 0 0; }
  .sugg-evidence {
    margin-top: 14px; padding: 12px 16px;
    background: var(--bg-2); border-radius: 10px;
    font-size: 12.5px; line-height: 1.65; color: var(--text-3);
  }
  .sugg-evidence::before { content: "证据 · "; font-weight: 800; font-size: 10px; letter-spacing: 1px; color: var(--text-4); }
  [lang-en] .sugg-evidence::before, .sugg-evidence.en::before { content: "EVIDENCE · "; }
  .evidence-ref {
    font-size: 10px; font-family: var(--mono); color: var(--accent-ink);
    background: var(--accent-soft); border-radius: 4px; padding: 1.5px 6px;
    cursor: pointer; margin-left: 5px;
  }
  .copy-block {
    margin-top: 14px;
    background: var(--accent-soft);
    border: 1px solid var(--accent-soft-strong);
    border-radius: 12px; padding: 14px 16px;
  }
  .copy-block-label {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
    color: var(--accent-ink); margin-bottom: 8px;
  }
  .copy-block-text {
    font-family: var(--mono); font-size: 12.5px; line-height: 1.65;
    color: var(--text-1); white-space: pre-wrap;
    max-height: 300px; overflow-y: auto;
  }
  .copy-btn {
    background: var(--bg-1); border: 1px solid var(--border-2); color: var(--text-3);
    padding: 3px 12px; border-radius: 6px; font-size: 10px; font-weight: 700;
    cursor: pointer; font-family: inherit; letter-spacing: 0.4px; text-transform: uppercase;
  }
  .copy-btn:hover { color: var(--accent-ink); border-color: var(--accent); }
  .copy-btn.copied { color: var(--good); border-color: var(--good); }
  .sugg-steps { margin: 12px 0 0; padding-left: 22px; font-size: 13.5px; color: var(--text-2); line-height: 1.8; }
  .sugg-foot { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
  .verify-by {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--text-3); background: var(--bg-2);
    border-radius: 7px; padding: 5px 10px;
  }
  .verify-by::before { content: "✓"; color: var(--good); font-weight: 800; }
  .impact { font-size: 11.5px; color: var(--text-4); }
  .impact::before { content: "→ "; color: var(--accent); font-weight: 700; }

  .sugg-list { display: flex; flex-direction: column; gap: 10px; }
  details.sugg-fold {
    background: var(--bg-1); border: 1px solid var(--border-2);
    border-radius: 14px; box-shadow: var(--shadow-card);
  }
  details.sugg-fold summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    padding: 15px 22px;
  }
  details.sugg-fold summary::-webkit-details-marker { display: none; }
  .sugg-row-title { font-size: 14px; font-weight: 700; color: var(--text-1); }
  .sugg-row-summary {
    font-size: 12.5px; color: var(--text-4);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1; min-width: 0;
  }
  .sugg-chevron { color: var(--text-5); font-size: 11px; transition: transform 0.15s ease; }
  details.sugg-fold[open] .sugg-chevron { transform: rotate(90deg); }
  details.sugg-fold .sugg-detail { padding: 2px 22px 20px; border-top: 1px dashed var(--border-1); margin-top: -2px; padding-top: 14px; }

  /* ═══ Scores ═══ */
  .score-table { display: flex; flex-direction: column; gap: 16px; }
  .cat-block {
    background: var(--bg-1); border: 1px solid var(--border-2);
    border-radius: 16px; box-shadow: var(--shadow-card);
    overflow: hidden;
  }
  .cat-head {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 24px 14px;
    border-bottom: 1px solid var(--border-1);
  }
  .cat-mark { width: 10px; height: 10px; border-radius: 3px; background: var(--cat-color); }
  .cat-name { font-size: 14.5px; font-weight: 750; }
  .cat-desc { font-size: 11.5px; color: var(--text-4); }
  .cat-score { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .cat-score-num { font-size: 21px; font-weight: 800; }
  .cat-block[data-cat="communication"] { --cat-color: var(--cat-comm); }
  .cat-block[data-cat="engineering"] { --cat-color: var(--cat-eng); }
  .cat-block[data-cat="outcome"] { --cat-color: var(--cat-out); }
  details.dim-row { border-bottom: 1px solid var(--border-1); }
  details.dim-row:last-child { border-bottom: none; }
  details.dim-row summary {
    list-style: none; cursor: pointer;
    display: grid; grid-template-columns: 170px 1fr 52px 46px;
    gap: 14px; align-items: center;
    padding: 12px 24px;
  }
  details.dim-row summary::-webkit-details-marker { display: none; }
  details.dim-row summary:hover { background: var(--bg-2); }
  .dim-name { font-size: 13px; font-weight: 600; color: var(--text-1); }
  .dim-name .dim-name-en { font-size: 10.5px; color: var(--text-4); font-weight: 500; margin-left: 6px; }
  .dim-name.na { color: var(--text-4); }
  .dim-bar { height: 5px; background: var(--bg-3); border-radius: 999px; overflow: hidden; }
  .dim-fill { height: 100%; border-radius: 999px; background: var(--cat-color); }
  .dim-score { font-size: 13.5px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-1); }
  .dim-score .na-text { font-size: 10px; font-weight: 700; color: var(--text-5); letter-spacing: 0.5px; }
  .dim-grade-cell { display: flex; justify-content: flex-end; }
  .dim-detail {
    padding: 4px 24px 18px; font-size: 13px; line-height: 1.75; color: var(--text-2);
    background: var(--bg-2);
    border-top: 1px dashed var(--border-1);
  }
  .dim-detail .dim-formula {
    font-size: 11px; color: var(--text-4); font-variant-numeric: tabular-nums;
    margin: 10px 0 6px;
  }
  .dim-detail ul { margin: 8px 0 0; padding: 0; list-style: none; }
  .dim-detail li { font-size: 12px; color: var(--text-3); padding: 3px 0 3px 16px; position: relative; }
  .dim-detail li::before { content: "→"; position: absolute; left: 0; color: var(--cat-color); opacity: 0.7; }
  .delta-badge { font-size: 11px; font-weight: 800; margin-left: 6px; }
  .delta-badge.up { color: var(--good); }
  .delta-badge.down { color: var(--bad); }

  /* ═══ Appendix ═══ */
  .appendix { display: flex; flex-direction: column; gap: 12px; }
  details.appx {
    background: var(--bg-1); border: 1px solid var(--border-2);
    border-radius: 14px; box-shadow: var(--shadow-card);
  }
  details.appx > summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    padding: 16px 24px;
    font-size: 14px; font-weight: 700;
  }
  details.appx > summary::-webkit-details-marker { display: none; }
  details.appx > summary .appx-count { font-size: 11px; color: var(--text-4); font-weight: 600; }
  details.appx > summary::after { content: "＋"; margin-left: auto; color: var(--text-4); }
  details.appx[open] > summary::after { content: "－"; }
  .appx-body { padding: 0 24px 22px; }

  .incident {
    display: flex; gap: 10px; padding: 10px 14px; border-radius: 10px;
    background: var(--bg-2); margin-bottom: 8px;
    font-size: 12.5px; color: var(--text-2); line-height: 1.6;
  }
  .subhead {
    font-size: 10.5px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase;
    color: var(--text-4); margin: 18px 0 10px;
  }
  .subhead:first-child { margin-top: 0; }
  details.episode { border: 1px solid var(--border-1); border-radius: 10px; margin-bottom: 8px; background: var(--bg-2); }
  details.episode summary {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; cursor: pointer; list-style: none;
    font-size: 12.5px; color: var(--text-2);
  }
  details.episode summary::-webkit-details-marker { display: none; }
  .episode-kind {
    font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
    padding: 2px 8px; border-radius: 999px; background: var(--bg-3); color: var(--text-3);
  }
  .episode-stats { margin-left: auto; display: flex; gap: 10px; font-size: 11px; color: var(--text-4); font-variant-numeric: tabular-nums; }
  .episode-flag { color: var(--bad); font-weight: 700; }
  .episode-body { padding: 4px 14px 12px; font-size: 12.5px; color: var(--text-3); line-height: 1.65; border-top: 1px dashed var(--border-1); }
  .episode-body .msg { margin-top: 8px; padding: 8px 12px; background: var(--bg-3); border-radius: 8px; font-size: 12px; }
  .episode-body .msg-label { font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-4); margin-bottom: 3px; }

  .atom { padding: 9px 12px; border-left: 2px solid var(--border-2); margin-bottom: 8px; font-size: 12px; color: var(--text-3); line-height: 1.6; }
  .atom .atom-id { font-family: var(--mono); font-size: 10px; color: var(--accent-ink); margin-right: 8px; }
  .atom .atom-after { color: var(--text-4); font-size: 11px; margin-top: 3px; }
  .atom.highlight { border-left-color: var(--accent); background: var(--accent-soft); }

  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stat-tile {
    background: var(--bg-2); border-radius: 10px; padding: 12px 14px;
  }
  .stat-tile .stat-num { font-size: 19px; font-weight: 800; color: var(--text-1); line-height: 1.2; }
  .stat-tile .stat-label { font-size: 10.5px; color: var(--text-4); margin-top: 2px; }
  .tool-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px; }
  .tool-list { list-style: none; padding: 0; margin: 0; }
  .tool-list li {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12.5px; color: var(--text-2); padding: 5px 0;
    border-bottom: 1px dashed var(--border-1);
  }
  .tool-list .count { color: var(--text-4); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 11.5px; }
  .asset-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 4px; }
  .asset-pill {
    font-size: 11px; padding: 5px 11px; border-radius: 7px;
    background: var(--bg-2); color: var(--text-4);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .asset-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.6; }
  .asset-pill.present { background: var(--grade-s-bg); color: var(--grade-s); }

  footer {
    margin-top: 70px; padding-top: 24px;
    border-top: 1px solid var(--border-1);
    color: var(--text-5); font-size: 11px; text-align: center; letter-spacing: 0.4px;
  }

  /* ═══ Responsive ═══ */
  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; padding: 28px 26px; }
    .hero-radar { max-width: 340px; margin: 0 auto; }
    .reads-grid { grid-template-columns: 1fr; }
    .topnav { display: none; }
    details.dim-row summary { grid-template-columns: 1fr 60px 46px; }
    .dim-bar { display: none; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .tool-cols { grid-template-columns: 1fr; }
  }
  @media print {
    .topbar { position: static; }
    details { break-inside: avoid; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#top">
      <svg viewBox="0 0 32 32" fill="none">
        <polygon points="16 3 28 9.5 28 22.5 16 29 4 22.5 4 9.5" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
        <circle cx="16" cy="16" r="2.6" fill="currentColor"/>
      </svg>
      <span class="brand-name">Codex Radar</span>
    </a>
    <div class="topbar-project" id="topbarProject"></div>
    <nav class="topnav" id="topnav">
      <a href="#verdict" data-section="verdict" data-en="Verdict" data-zh="结论"></a>
      <a href="#reads" data-section="reads" data-en="Key Reads" data-zh="重点评价"></a>
      <a href="#plan" data-section="plan" data-en="Action Plan" data-zh="重点建议"></a>
      <a href="#scores" data-section="scores" data-en="Scorecard" data-zh="评分明细"></a>

<div class="page" id="top">

  <div id="warningsBanner"></div>

  <!-- ─── Verdict ─── -->
  <section class="section" id="verdict" style="margin-bottom:48px">
    <div class="hero">
      <div class="hero-left" style="position:relative;z-index:1">

        <p class="insight" id="insight"></p>
        <div class="verdict-row">
          <div class="grade-letter" id="gradeLetter"></div>
          <div class="verdict-detail">
            <div class="verdict-score"><span id="scoreNum"></span><span class="of"> / 100</span><span id="scoreDelta"></span></div>
            <div class="verdict-label" id="gradeLabel"></div>

  <!-- ─── Key reads ─── -->
  <section class="section" id="reads">
    <div class="section-head">
      <span class="section-kicker">01</span>
      <span class="section-title" data-en="Key Reads" data-zh="重点评价"></span>
      <span class="section-hint" data-en="The verdict, in three sentences" data-zh="三句话看懂这份报告"></span>
    </div>
    <div class="pull-quote" id="coreDiagnosis"></div>
    <div class="reads-grid" id="readsGrid"></div>
    <div class="cross-strip" id="crossReading"></div>
    <details class="profile-fold">
      <summary data-en="Full collaboration profile" data-zh="完整协作画像"></summary>
      <div class="fold-body" id="profileText"></div>
    </details>

  <!-- ─── Action plan ─── -->
  <section class="section" id="plan">
    <div class="section-head">
      <span class="section-kicker">02</span>

  <!-- ─── Scores ─── -->
  <section class="section" id="scores">

      <span class="section-kicker">03</span>

  <!-- ─── Appendix ─── -->
  <section class="section" id="appendix">

      <span class="section-kicker">04</span>
      <span class="section-title" data-en="Appendix" data-zh="附录"></span>
      <span class="section-hint" data-en="Sessions, tooling, evidence" data-zh="会话、工具与证据底稿"></span>

  <footer id="footer"></footer>
</div>

<div class="radar-tip" id="radarTip"></div>

<script id="report-data" type="application/json">{{REPORT_DATA}}</script>

<script>
(function() {
  const CAT_ORDER = ['communication', 'engineering', 'outcome'];
  const CAT_NAMES = {
    communication: { en: 'Communication', zh: '沟通力' },
    engineering: { en: 'Engineering', zh: '工程力' },
    outcome: { en: 'Outcome', zh: '成效' }
  };
  const CAT_DESC = {
    communication: { en: 'How clearly you direct AI', zh: '你怎么用文字驱动 AI' },
    engineering: { en: 'How well you leverage the platform', zh: '你把平台用到几成' },
    outcome: { en: 'What actually gets shipped', zh: '实际产出的质量' }
  };
  const GRADE_DESC = {
    S: { en: 'In The Zone', zh: '心流共振' }, A: { en: 'Synced Up', zh: '默契搭档' },
    B: { en: 'Finding Groove', zh: '稳步探索' }, C: { en: 'Freestyling', zh: '随性对话' },
    D: { en: 'Day One', zh: '初识旅程' }
  };
  const TYPE_LABELS = {
    prompt_rewrite: { en: 'Prompt', zh: '话术' }, workflow_habit: { en: 'Workflow', zh: '工作流' },
    setup_action: { en: 'Setup', zh: '脚手架' }, tool_adoption: { en: 'Tool', zh: '工具' },
    verification_loop: { en: 'Verify', zh: '验证环' }
  };
  const I18N = {
    sessions: { en: 'sessions', zh: '个会话' }, messages: { en: 'messages', zh: '条消息' },
    days: { en: 'days', zh: '天' }, confidence: { en: 'confidence', zh: '可信度' },
    subagentNote: { en: 'subagent threads excluded', zh: '个子代理线程未计入' },
    automationShare: { en: 'automation', zh: '自动化运行' },
    strength: { en: 'Strongest signal', zh: '最强信号' },
    bottleneck: { en: 'Main bottleneck', zh: '首要瓶颈' },
    coreLabel: { en: 'Core diagnosis', zh: '核心诊断' },
    focusFlag: { en: 'Do this first', zh: '先做这一件' },
    promptRewrite: { en: 'Copy this prompt', zh: '复制这段试试' },
    snippet: { en: 'Paste-ready file', zh: '可直接落盘' },
    steps: { en: 'Playbook', zh: '操作步骤' },
    verifyBy: { en: 'Verify next run:', zh: '下次运行验证：' },
    copy: { en: 'Copy', zh: '复制' }, copied: { en: 'Copied', zh: '已复制' },
    sinceLast: { en: 'vs last run', zh: '较上次' },
    baseline: { en: 'baseline', zh: '公式基线' }, adjustment: { en: 'evidence adjustment', zh: '证据微调' },
    incidentsTitle: { en: 'Friction points', zh: '卡壳点' },
    episodesTitle: { en: 'Recent sessions', zh: '近期会话' },
    atomsTitle: { en: 'Cited evidence', zh: '引用的证据' },
    sessionsAppx: { en: 'Session trails', zh: '会话轨迹' },
    toolingAppx: { en: 'Tooling & platform', zh: '工具与平台' },
    agentsDraftTitle: { en: 'AGENTS.md draft — generated from your sessions', zh: 'AGENTS.md 草稿 — 由你的会话史生成' },
    warningsTitle: { en: 'Heads-up', zh: '注意' },
    minutes: { en: 'min', zh: '分钟' }, edits: { en: 'edits', zh: '次编辑' },
    proof: { en: 'proof', zh: '验证' }, failedCmd: { en: 'failed', zh: '失败命令' },
    opening: { en: 'Opening', zh: '开场' }, closing: { en: 'Closing', zh: '收尾' },
    toolCalls: { en: 'Tool calls', zh: '工具调用' }, cmdSuccess: { en: 'Cmd success', zh: '命令成功率' },
    planUpdates: { en: 'Plan updates', zh: 'Plan 更新' }, webSearch: { en: 'Web search', zh: '网页搜索' },
    peakContext: { en: 'Peak context', zh: '上下文峰值' }, compactions: { en: 'Compactions', zh: '上下文压缩' },
    subagents: { en: 'Subagents', zh: '子代理' }, imageGen: { en: 'Image gen', zh: '图像生成' },
    byCategory: { en: 'Tool categories', zh: '工具类别' }, topTools: { en: 'Top tools', zh: '高频工具' },
    assets: { en: 'Project assets', zh: '项目资产' },
    assetsUnresolved: { en: 'Project working directory not located — asset detection skipped.', zh: '未能定位项目工作目录，跳过资产检测。' },
    runs: { en: 'runs', zh: '次运行' },
    footer: { en: 'Codex Radar — local analysis, zero telemetry. Formulas computed in code; adjustments cited to evidence.', zh: 'Codex Radar — 全本地分析，零数据上传。公式基线由代码计算，微调逐条引用证据。' }
  };

  let report;
  try { report = JSON.parse(document.getElementById('report-data').textContent); }
  catch (e) { document.body.innerHTML = '<div style="padding:40px;font-family:monospace">Failed to parse report data: ' + e.message + '</div>'; return; }

  let lang = report.language || 'zh';

  function t(f) {
    if (f == null) return '';
    if (typeof f === 'string') return f;
    if (typeof f === 'object') return f[lang] || f.en || f.zh || '';
    return String(f);
  }
  function tc(k) { return (I18N[k] && (I18N[k][lang] || I18N[k].en)) || ''; }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function gradeFromScore(s) { if (s == null) return null; return s >= 85 ? 'S' : s >= 70 ? 'A' : s >= 55 ? 'B' : s >= 40 ? 'C' : 'D'; }
  function fmtDate(iso) {
    try { return new Date(iso).toLocaleDateString(lang === 'zh' ? 'zh-CN' : 'en-US', { year: 'numeric', month: 'short', day: 'numeric' }); }
    catch { return iso; }
  }
  function firstSentence(s) {
    if (!s) return '';
    const parts = String(s).split(/(?<=[.。！!？?；;])/);
    for (const p of parts) { const x = p.trim(); if (x.length > 8) return x; }
    return String(s).slice(0, 100);
  }
  function boldify(s) { return esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }
  function deltaBadge(v, withLabel) {
    if (v == null || !isFinite(v) || Math.round(v) === 0) return '';
    const r = Math.round(v);
    return '<span class="delta-badge ' + (r > 0 ? 'up' : 'down') + '">' + (r > 0 ? '+' : '') + r + (withLabel ? ' ' + tc('sinceLast') : '') + '</span>';
  }
  function scoreChip(grade, score) {
    if (grade == null) return '';
    return '<span class="score-chip" data-grade="' + grade + '">' + grade + (score != null ? ' · ' + score : '') + '</span>';
  }
  const dimById = {};
  (report.dimensions || []).forEach(d => { dimById[d.id] = d; });

  /* ── Derivations (renderer computes when schema omits) ── */
  function deriveHighlights() {
    const h = report.highlights || {};
    const applicable = (report.dimensions || []).filter(d => d.applicable !== false && d.score != null);
    const best = applicable.slice().sort((a, b) => b.score - a.score)[0];
    const worst = applicable.slice().sort((a, b) => a.score - b.score)[0];
    return {
      strength: h.strength || (best && { dimensionId: best.id, headline: { [lang]: firstSentence(t(best.reasoning)) } }),
      bottleneck: h.bottleneck || (worst && { dimensionId: worst.id, headline: { [lang]: firstSentence(t(worst.reasoning)) } })
    };
  }
  function suggSummary(s) { return t(s.summary) || firstSentence(t(s.body)); }

  /* ═══ Render ═══ */
  function render() {
    document.documentElement.lang = lang;
    document.title = 'Codex Radar · ' + (report.project || 'Collaboration Report');
    document.querySelectorAll('[data-en]').forEach(el => { el.textContent = el.dataset[lang] || el.dataset.en; });
    document.getElementById('langBtn').textContent = lang === 'zh' ? 'EN' : '中';

    const profile = report.profile || {};
    const grade = report.overallGrade || gradeFromScore(report.overallScore);

    document.getElementById('topbarProject').innerHTML =
      '<strong>' + esc(report.project) + '</strong> · ' + fmtDate(report.generatedAt);

    renderBanner();

    /* Hero */
    document.getElementById('profileLabel').textContent = t(profile.label) || profile.type || '';
    document.getElementById('insight').textContent = t(report.insight);
    const gl = document.getElementById('gradeLetter');
    gl.textContent = grade; gl.dataset.grade = grade;
    document.getElementById('scoreNum').textContent = report.overallScore != null ? report.overallScore : '–';
    document.getElementById('scoreDelta').innerHTML = report.delta ? deltaBadge(report.delta.overall) : '';
    document.getElementById('gradeLabel').textContent = (GRADE_DESC[grade] && GRADE_DESC[grade][lang]) || '';
    renderTrendChip();

    const chips = [];
    if (profile.sessionCount) chips.push(profile.sessionCount + ' ' + tc('sessions'));
    if (profile.humanMessages) chips.push(profile.humanMessages + ' ' + tc('messages'));
    if (profile.dateRange && profile.dateRange[0] && profile.dateRange[1]) {
      const days = Math.max(1, Math.round((new Date(profile.dateRange[1]) - new Date(profile.dateRange[0])) / 86400000));
      chips.push(days + ' ' + tc('days'));
    }
    if (profile.confidence) chips.push(profile.confidence + ' ' + tc('confidence'));
    if (profile.automationShare > 0) chips.push(Math.round(profile.automationShare * 100) + '% ' + tc('automationShare'));
    if (profile.subagentSessionsExcluded > 0) chips.push(profile.subagentSessionsExcluded + ' ' + tc('subagentNote'));
    document.getElementById('metaChips').innerHTML = chips.map(c => '<span class="meta-chip">' + esc(c) + '</span>').join('');

    renderRadar();
    renderReads();
    renderPlan();
    renderScores();
    renderAppendix();

    document.getElementById('footer').textContent = tc('footer');
    setupCopy();
    setupNav();
  }

  function renderBanner() {
    const wrap = document.getElementById('warningsBanner');
    const items = [].concat(report.parserWarnings || [], report.schemaWarnings || []);
    wrap.innerHTML = items.length
      ? '<div class="banner"><strong>' + tc('warningsTitle') + '</strong><ul>' + items.map(w => '<li>' + esc(w) + '</li>').join('') + '</ul></div>'
      : '';
  }

  function renderTrendChip() {
    const wrap = document.getElementById('trendChip');
    const hist = (report.history || []).filter(h => typeof h.overallScore === 'number');
    const pts = hist.map(h => h.overallScore).concat([report.overallScore]);
    if (pts.length < 2) { wrap.innerHTML = ''; wrap.style.display = 'none'; return; }
    const w = 84, h = 26, pad = 3;
    const min = Math.min(...pts), max = Math.max(...pts), span = Math.max(6, max - min);
    const x = i => pad + (w - 2 * pad) * i / (pts.length - 1);
    const y = s => h - pad - (h - 2 * pad) * (s - min) / span;
    const path = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(p).toFixed(1)).join(' ');
    wrap.innerHTML =
      '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
        '<path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity="0.75"/>' +
        '<circle cx="' + x(pts.length - 1).toFixed(1) + '" cy="' + y(pts[pts.length - 1]).toFixed(1) + '" r="3" fill="var(--accent)"/>' +
      '</svg>' +
      '<span class="trend-note">' + pts.length + ' ' + tc('runs') + ' · ' + pts[0] + ' → ' + pts[pts.length - 1] + '</span>';
  }

  /* ── Radar (9 axes, fixed dimension order) ── */
  function renderRadar() {
    const dims = report.dimensions || [];
    const n = dims.length;
    if (!n) { document.getElementById('heroRadar').innerHTML = ''; return; }
    const W = 320, H = 300, cx = W / 2, cy = H / 2 + 4, R = 100;
    const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
    const px = (i, r) => cx + r * Math.cos(ang(i));
    const py = (i, r) => cy + r * Math.sin(ang(i));
    let out = '';
    [25, 50, 75, 100].forEach(v => {
      const r = R * v / 100;
      out += '<polygon class="radar-grid" points="' + dims.map((_, i) => px(i, r).toFixed(1) + ',' + py(i, r).toFixed(1)).join(' ') + '"/>';
    });
    dims.forEach((_, i) => { out += '<line class="radar-axis" x1="' + cx + '" y1="' + cy + '" x2="' + px(i, R).toFixed(1) + '" y2="' + py(i, R).toFixed(1) + '"/>'; });
    out += '<text class="radar-tick" x="' + (cx + 3) + '" y="' + (cy - R * 0.5 - 2).toFixed(1) + '">50</text>';
    out += '<text class="radar-tick" x="' + (cx + 3) + '" y="' + (cy - R - 2).toFixed(1) + '">100</text>';
    const shapePts = dims.map((d, i) => {
      const v = (d.applicable === false || d.score == null) ? 0 : d.score;
      return px(i, R * v / 100).toFixed(1) + ',' + py(i, R * v / 100).toFixed(1);
    });
    out += '<polygon class="radar-shape" points="' + shapePts.join(' ') + '"/>';
    dims.forEach((d, i) => {
      const isNA = d.applicable === false || d.score == null;
      const r = isNA ? 0 : R * d.score / 100;
      out += '<circle class="radar-dot' + (isNA ? ' na' : '') + '" r="' + (isNA ? 3 : 3.5) + '" cx="' + px(i, r).toFixed(1) + '" cy="' + py(i, r).toFixed(1) + '"' +
        ' data-name="' + esc(t(d.name)) + '" data-score="' + (isNA ? 'N/A' : d.score) + '"/>';
      const lr = R + 16;
      const a = ang(i), cos = Math.cos(a);
      const anchor = Math.abs(cos) < 0.25 ? 'middle' : (cos > 0 ? 'start' : 'end');
      const ly = py(i, lr) + (Math.sin(a) > 0.8 ? 7 : Math.sin(a) < -0.8 ? -2 : 3);
      out += '<text class="radar-label' + (isNA ? ' na' : '') + '" text-anchor="' + anchor + '" x="' + px(i, lr).toFixed(1) + '" y="' + ly.toFixed(1) + '">' +
        esc(t(d.name)) + (isNA ? ' ·N/A' : '') + '</text>';
    });
    document.getElementById('heroRadar').innerHTML =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="9-dimension radar">' + out + '</svg>';

    const tip = document.getElementById('radarTip');
    document.querySelectorAll('.radar-dot').forEach(dot => {
      dot.addEventListener('mouseenter', e => {
        tip.innerHTML = esc(dot.dataset.name) + ' <span class="tip-score">' + esc(dot.dataset.score) + '</span>';
        tip.style.opacity = '1';
      });
      dot.addEventListener('mousemove', e => { tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; });
      dot.addEventListener('mouseleave', () => { tip.style.opacity = '0'; });
    });
  }

  /* ── Key reads ── */
  function renderReads() {
    const dx = report.diagnosis || {};
    document.getElementById('coreDiagnosis').innerHTML =
      '<span class="pq-label">' + tc('coreLabel') + '</span>' + boldify(t(dx.coreDiagnosis) || '—');

    const hl = deriveHighlights();
    const grid = document.getElementById('readsGrid');
    grid.innerHTML = '';
    [['strength', hl.strength], ['bottleneck', hl.bottleneck]].forEach(([kind, item]) => {
      if (!item) return;
      const dim = dimById[item.dimensionId];
      const grade = dim && (dim.grade || gradeFromScore(dim.score));
      const card = document.createElement('div');
      card.className = 'read-card ' + kind;
      card.innerHTML =
        '<div class="read-head">' +
          '<span class="read-kicker">' + (kind === 'strength' ? '▲ ' : '▼ ') + tc(kind) + '</span>' +
          (dim ? '<span class="read-dim">' + esc(t(dim.name)) + ' ' + scoreChip(grade, dim.score) + '</span>' : '') +
        '</div>' +
        '<div class="read-headline">' + esc(t(item.headline)) + '</div>';
      if (dim) card.addEventListener('click', () => {
        const row = document.getElementById('dim-' + dim.id);
        if (row) { row.open = true; row.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      });
      grid.appendChild(card);
    });

    document.getElementById('crossReading').textContent = t(dx.crossDimensionReading) || '';
    document.getElementById('profileText').textContent = t(dx.collaborationProfile) || '—';
  }

  /* ── Suggestions ── */
  function suggInner(s, idx, isFocus) {
    const typeLabel = s.type && TYPE_LABELS[s.type] ? (TYPE_LABELS[s.type][lang] || TYPE_LABELS[s.type].en) : null;
    const dim = s.dimensionId ? dimById[s.dimensionId] : null;
    const refs = (s.evidenceRefs || []).map(r => '<span class="evidence-ref" data-ref="' + esc(r) + '">' + esc(r) + '</span>').join('');
    const steps = Array.isArray(s.steps) ? s.steps : null;
    let html =
      '<div class="sugg-head">' +
        '<span class="pill pill-' + (s.priority || 'medium') + '">' + esc(s.priority || 'medium') + '</span>' +
        (typeLabel ? '<span class="pill pill-type">' + esc(typeLabel) + '</span>' : '') +
        (dim ? '<span class="pill pill-dim">' + esc(t(dim.name)) + '</span>' : '') +
        '<div class="sugg-title">' + esc(t(s.title)) + '</div>' +
      '</div>' +
      '<div class="sugg-body">' + esc(t(s.body)) + '</div>' +
      (s.evidence ? '<div class="sugg-evidence' + (lang === 'en' ? ' en' : '') + '">' + esc(t(s.evidence)) + refs + '</div>' : '');
    if (steps && steps.length) {
      html += '<ol class="sugg-steps">' + steps.map(st => '<li>' + esc(t(st)) + '</li>').join('') + '</ol>';
    }
    if (s.promptRewrite) {
      html += '<div class="copy-block"><div class="copy-block-label"><span>' + tc('promptRewrite') + '</span>' +
        '<button class="copy-btn" data-copy-target="prompt-' + idx + '">' + tc('copy') + '</button></div>' +
        '<div class="copy-block-text" id="prompt-' + idx + '">' + esc(t(s.promptRewrite)) + '</div></div>';
    }
    if (s.snippet) {
      html += '<div class="copy-block"><div class="copy-block-label"><span>' + tc('snippet') + '</span>' +
        '<button class="copy-btn" data-copy-target="snippet-' + idx + '">' + tc('copy') + '</button></div>' +
        '<div class="copy-block-text" id="snippet-' + idx + '">' + esc(typeof s.snippet === 'string' ? s.snippet : t(s.snippet)) + '</div></div>';
    }
    if (s.verifyBy || s.expectedImpact) {
      html += '<div class="sugg-foot">' +
        (s.verifyBy ? '<span class="verify-by">' + tc('verifyBy') + ' ' + esc(t(s.verifyBy)) + '</span>' : '') +
        (s.expectedImpact ? '<span class="impact">' + esc(t(s.expectedImpact)) + '</span>' : '') +
      '</div>';
    }
    return html;
  }

  function renderPlan() {
    const list = report.suggestions || [];
    const focusWrap = document.getElementById('focusSuggestion');
    const rest = document.getElementById('suggList');
    focusWrap.innerHTML = ''; rest.innerHTML = '';
    if (!list.length) {
      focusWrap.innerHTML = '<div style="color:var(--text-4);font-size:13px;font-style:italic">No critical bottlenecks — keep doing what you are doing.</div>';
      return;
    }
    const focusIdx = (report.highlights && typeof report.highlights.focusIndex === 'number') ? report.highlights.focusIndex : 0;
    list.forEach((s, i) => {
      if (i === focusIdx) {
        focusWrap.innerHTML = '<div class="focus-card"><div class="focus-flag">' + tc('focusFlag') + '</div>' + suggInner(s, i, true) + '</div>';
      } else {
        const d = document.createElement('details');
        d.className = 'sugg-fold';
        d.innerHTML =
          '<summary>' +
            '<span class="pill pill-' + (s.priority || 'medium') + '">' + esc(s.priority || 'medium') + '</span>' +
            '<span class="sugg-row-title">' + esc(t(s.title)) + '</span>' +
            '<span class="sugg-row-summary">' + esc(suggSummary(s)) + '</span>' +
            '<span class="sugg-chevron">▶</span>' +
          '</summary>' +
          '<div class="sugg-detail">' + suggInner(s, i, false) + '</div>';
        rest.appendChild(d);
      }
    });

    const draft = document.getElementById('agentsDraft');
    if (report.agentsMdDraft) {
      draft.innerHTML =
        '<details class="sugg-fold"><summary>' +
          '<span class="pill pill-type">Setup</span>' +
          '<span class="sugg-row-title">' + tc('agentsDraftTitle') + '</span>' +
          '<span class="sugg-chevron">▶</span></summary>' +
          '<div class="sugg-detail"><div class="copy-block"><div class="copy-block-label"><span>AGENTS.md</span>' +
          '<button class="copy-btn" data-copy-target="agents-draft-text">' + tc('copy') + '</button></div>' +
          '<div class="copy-block-text" id="agents-draft-text">' + esc(typeof report.agentsMdDraft === 'string' ? report.agentsMdDraft : t(report.agentsMdDraft)) + '</div></div></div>' +
        '</details>';
    } else { draft.innerHTML = ''; }
  }

  /* ── Scorecard ── */
  function renderScores() {
    const wrap = document.getElementById('scoreTable');
    wrap.innerHTML = '';
    const dimsByCat = {};
    (report.dimensions || []).forEach(d => { (dimsByCat[d.category] = dimsByCat[d.category] || []).push(d); });
    CAT_ORDER.forEach(cat => {
      const dims = dimsByCat[cat];
      if (!dims || !dims.length) return;
      const catScore = (report.categoryScores || {})[cat];
      const catGrade = catScore != null ? gradeFromScore(catScore) : null;
      const catDelta = report.delta && report.delta.categories ? report.delta.categories[cat] : null;
      const block = document.createElement('div');
      block.className = 'cat-block'; block.dataset.cat = cat;
      let rows = '';
      dims.forEach(d => {
        const isNA = d.applicable === false || d.score == null;
        const g = d.grade || (d.score != null ? gradeFromScore(d.score) : null);
        const dimDelta = report.delta && report.delta.dimensions ? report.delta.dimensions[d.id] : null;
        const formula = (!isNA && typeof d.baseline === 'number')
          ? '<div class="dim-formula">' + tc('baseline') + ' ' + d.baseline +
            (typeof d.adjustment === 'number' && d.adjustment !== 0 ? ' · ' + (d.adjustment > 0 ? '+' : '') + d.adjustment + ' ' + tc('adjustment') : '') +
            ' → ' + d.score + '</div>'
          : '';
        rows +=
          '<details class="dim-row" id="dim-' + esc(d.id) + '">' +
            '<summary>' +
              '<span class="dim-name' + (isNA ? ' na' : '') + '">' + esc(t(d.name)) +
                (lang === 'zh' && d.name && d.name.en ? '<span class="dim-name-en">' + esc(d.name.en) + '</span>' : '') + '</span>' +
              '<span class="dim-bar">' + (isNA ? '' : '<span class="dim-fill" style="display:block;width:' + Math.max(0, Math.min(100, d.score)) + '%"></span>') + '</span>' +
              '<span class="dim-score">' + (isNA ? '<span class="na-text">N/A</span>' : d.score + (dimDelta != null ? deltaBadge(dimDelta) : '')) + '</span>' +
              '<span class="dim-grade-cell">' + (isNA ? '' : scoreChip(g)) + '</span>' +
            '</summary>' +
            '<div class="dim-detail">' +
              '<div style="font-size:11.5px;color:var(--text-4)">' + esc(t(d.description)) + '</div>' +
              formula +
              '<div>' + esc(t(d.reasoning)) + '</div>' +
              ((d.evidence || []).length ? '<ul>' + d.evidence.map(e => '<li>' + esc(typeof e === 'string' ? e : t(e)) + '</li>').join('') + '</ul>' : '') +
            '</div>' +
          '</details>';
      });
      block.innerHTML =
        '<div class="cat-head">' +
          '<span class="cat-mark"></span>' +
          '<div><div class="cat-name">' + esc(CAT_NAMES[cat][lang]) + '</div>' +
          '<div class="cat-desc">' + esc(CAT_DESC[cat][lang]) + '</div></div>' +
          '<div class="cat-score">' +
            (catScore != null
              ? '<span class="cat-score-num">' + catScore + '</span>' + (catDelta != null ? deltaBadge(catDelta) : '') + scoreChip(catGrade)
              : '<span class="na-text" style="font-size:11px;color:var(--text-5);font-weight:700">N/A</span>') +
          '</div>' +
        '</div>' + rows;
      wrap.appendChild(block);
    });
  }

  /* ── Appendix ── */
  function renderAppendix() {
    const wrap = document.getElementById('appendixBody');
    wrap.innerHTML = '';
    const incidents = report.incidents || [];
    const episodes = report.episodes || [];
    const atoms = report.evidenceAtoms || [];

    if (incidents.length || episodes.length || atoms.length) {
      let body = '';
      if (incidents.length) {
        body += '<div class="subhead">' + tc('incidentsTitle') + '</div>' +
          incidents.map(inc => '<div class="incident"><span>🧭</span><span>' + esc(inc.summary) +
            (inc.evidenceRefs || []).map(r => '<span class="evidence-ref" data-ref="' + esc(r) + '">' + esc(r) + '</span>').join('') +
            '</span></div>').join('');
      }
      if (episodes.length) {
        body += '<div class="subhead">' + tc('episodesTitle') + '</div>' +
          episodes.slice().reverse().map(ep => {
            const stats = [];
            if (ep.durationMinutes != null) stats.push(ep.durationMinutes + ' ' + tc('minutes'));
            if (ep.edits) stats.push(ep.edits + ' ' + tc('edits'));
            const proofTotal = (ep.proofPassed || 0) + (ep.proofFailed || 0) + (ep.proofUnknown || 0);
            if (proofTotal) stats.push(proofTotal + ' ' + tc('proof'));
            if (ep.failedCommands) stats.push('<span class="episode-flag">' + ep.failedCommands + ' ' + tc('failedCmd') + '</span>');
            if (ep.aborts) stats.push('<span class="episode-flag">' + ep.aborts + ' abort</span>');
            const planLine = ep.planCompletion && ep.planCompletion.total
              ? '<div class="msg"><div class="msg-label">PLAN</div>' + ep.planCompletion.completed + ' / ' + ep.planCompletion.total + (lang === 'zh' ? ' 步完成' : ' steps completed') + '</div>'
              : '';
            return '<details class="episode"><summary>' +
              '<span class="episode-kind">' + esc(ep.kind || 'interactive') + '</span>' +
              '<span>' + esc(ep.threadName || fmtDate(ep.startedAt) || ep.sessionId || '') + '</span>' +
              '<span class="episode-stats">' + stats.join(' · ') + '</span></summary>' +
              '<div class="episode-body">' +
                (ep.firstUserMessage ? '<div class="msg"><div class="msg-label">' + tc('opening') + '</div>' + esc(ep.firstUserMessage) + '</div>' : '') +
                (ep.lastAgentMessage ? '<div class="msg"><div class="msg-label">' + tc('closing') + '</div>' + esc(ep.lastAgentMessage) + '</div>' : '') +
                planLine +
              '</div></details>';
          }).join('');
      }
      if (atoms.length) {
        body += '<div class="subhead">' + tc('atomsTitle') + '</div>' +
          atoms.map(a => {
            const after = a.after
              ? '<div class="atom-after">→ ' + (a.after.toolCalls || 0) + ' tools · ' + (a.after.edits || 0) + ' edits' +
                (a.after.failedCommands ? ' · <span class="episode-flag">' + a.after.failedCommands + ' failed</span>' : '') +
                (a.after.proofRuns ? ' · ' + a.after.proofRuns + ' proof' : '') + '</div>'
              : '';
            return '<div class="atom" id="atom-' + esc(a.id) + '"><span class="atom-id">' + esc(a.id) + '</span><span>' + esc(a.snippet) + '</span>' + after + '</div>';
          }).join('');
      }
      const d = document.createElement('details');
      d.className = 'appx'; d.id = 'appx-sessions';
      d.innerHTML = '<summary>' + tc('sessionsAppx') +
        '<span class="appx-count">' + episodes.length + ' ' + tc('sessions') + ' · ' + atoms.length + ' evidence</span></summary>' +
        '<div class="appx-body">' + body + '</div>';
      wrap.appendChild(d);
    }

    /* Tooling */
    const td = report.toolcraftDetails || {};
    const mt = report.modernTools || {};
    const hygiene = mt.contextHygiene || {};
    const assets = report.projectAssets || {};
    const tiles = [
      [td.totalToolCalls || 0, tc('toolCalls')],
      [td.commandSuccessRate != null ? Math.round(td.commandSuccessRate * 100) + '%' : '–', tc('cmdSuccess')],
      [td.imageCalls || 0, tc('imageGen')],
      [td.planUpdates || 0, tc('planUpdates')],
      [td.subagentCalls || 0, tc('subagents')],
      [td.webSearchCalls || 0, tc('webSearch')],
      [hygiene.compactions || 0, tc('compactions')],
      [hygiene.maxContextUsedPct ? Math.round(hygiene.maxContextUsedPct * 100) + '%' : '–', tc('peakContext')]
    ];
    let toolBody = '<div class="stat-grid">' +
      tiles.map(([num, label]) => '<div class="stat-tile"><div class="stat-num">' + num + '</div><div class="stat-label">' + esc(label) + '</div></div>').join('') +
      '</div>';
    function toolList(arr) {
      if (!arr || !arr.length) return '<div style="font-size:11.5px;color:var(--text-5);font-style:italic">—</div>';
      return '<ul class="tool-list">' + arr.map(it => '<li><span>' + esc(it.name) + '</span><span class="count">' + it.count + '</span></li>').join('') + '</ul>';
    }
    toolBody += '<div class="tool-cols">' +
      '<div><div class="subhead">' + tc('byCategory') + '</div>' + toolList(td.byCategory) + '</div>' +
      '<div><div class="subhead">' + tc('topTools') + '</div>' + toolList(td.topTools) + '</div>' +
      '</div>';
    const mcpServers = Object.entries(mt.mcpByServer || {});
    if (mcpServers.length) {
      toolBody += '<div class="subhead">MCP</div><ul class="tool-list">' +
        mcpServers.map(([srv, info]) => '<li><span>' + esc(srv) +
          ((info.tools || []).length ? ' <span style="color:var(--text-5);font-size:11px">' + info.tools.slice(0, 3).map(x => esc(x.name)).join(', ') + '</span>' : '') +
          '</span><span class="count">' + info.calls +
          (info.errors ? ' <span class="episode-flag">(' + info.errors + ' err)</span>' : '') + '</span></li>').join('') + '</ul>';
    }
    const lifecycle = mt.subagentLifecycle;
    const subAct = report.subagentActivity;
    if ((lifecycle && lifecycle.spawned) || (subAct && subAct.sessionCount)) {
      toolBody += '<div class="subhead">' + (lang === 'zh' ? '多代理编排' : 'Orchestration') + '</div>';
      if (lifecycle && lifecycle.spawned) {
        toolBody += '<div class="stat-grid">' +
          [[lifecycle.spawned || 0, lang === 'zh' ? '派生' : 'Spawned'],
           [lifecycle.waited || 0, lang === 'zh' ? '等待' : 'Waited'],
           [lifecycle.closed || 0, lang === 'zh' ? '关闭' : 'Closed'],
           [lifecycle.orphanedEstimate || 0, lang === 'zh' ? '未回收' : 'Orphaned']]
          .map(([num, label], i) => '<div class="stat-tile"><div class="stat-num"' + (i === 3 && num > 0 ? ' style="color:var(--bad)"' : '') + '>' + num + '</div><div class="stat-label">' + esc(label) + '</div></div>').join('') +
          '</div>';
      }
      if (subAct && subAct.sessionCount) {
        toolBody += '<div style="margin-top:10px;font-size:11.5px;color:var(--text-4);line-height:1.6">' +
          subAct.sessionCount + ' ' + tc('subagentNote') +
          (Object.keys(subAct.byRole || {}).length ? ' · ' + Object.entries(subAct.byRole).map(([role, count]) => esc(role) + '×' + count).join(' · ') : '') +
          '</div>';
      }
    }
    toolBody += '<div class="subhead">' + tc('assets') + '</div>';
    if (!assets.cwdResolved) {
      toolBody += '<div style="font-size:12px;color:var(--text-4)">' + tc('assetsUnresolved') + '</div>';
    } else {
      const items = [['hasAgentsMd', 'AGENTS.md'], ['hasCodexDir', '.codex'], ['hasAgentsDir', '.agents'], ['hasGit', 'Git'], ['hasTestsDir', 'Tests'], ['hasReadme', 'README'], ['hasManifest', 'Manifest']];
      toolBody += '<div class="asset-row">' + items.map(([k, label]) =>
        '<span class="asset-pill' + (assets[k] ? ' present' : '') + '">' + label + '</span>').join('') + '</div>';
    }
    const dTool = document.createElement('details');
    dTool.className = 'appx';
    dTool.innerHTML = '<summary>' + tc('toolingAppx') +
      '<span class="appx-count">' + (td.totalToolCalls || 0) + ' ' + tc('toolCalls').toLowerCase() + '</span></summary>' +
      '<div class="appx-body">' + toolBody + '</div>';
    wrap.appendChild(dTool);
  }

  /* ── Wiring ── */
  function setupCopy() {
    document.querySelectorAll('.copy-btn[data-copy-target]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault();
        const target = document.getElementById(btn.dataset.copyTarget);
        if (!target) return;
        navigator.clipboard.writeText(target.textContent).then(() => {
          btn.textContent = tc('copied'); btn.classList.add('copied');
          setTimeout(() => { btn.textContent = tc('copy'); btn.classList.remove('copied'); }, 1500);
        });
      });
    });
    document.querySelectorAll('.evidence-ref[data-ref]').forEach(chip => {
      chip.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        const appx = document.getElementById('appx-sessions');
        if (appx) appx.open = true;
        const atom = document.getElementById('atom-' + chip.dataset.ref);
        if (!atom) return;
        atom.scrollIntoView({ behavior: 'smooth', block: 'center' });
        atom.classList.add('highlight');
        setTimeout(() => atom.classList.remove('highlight'), 2500);
      });
    });
  }

  function setupNav() {
    const links = document.querySelectorAll('.topnav a');
    const sections = ['verdict', 'reads', 'plan', 'scores', 'appendix'].map(id => document.getElementById(id)).filter(Boolean);
    const byId = {}; links.forEach(l => { byId[l.dataset.section] = l; });
    const obs = new IntersectionObserver(entries => {
      const vis = entries.filter(e => e.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio);
      if (vis.length) links.forEach(l => l.classList.toggle('active', l.dataset.section === vis[0].target.id));
    }, { rootMargin: '-20% 0px -60% 0px', threshold: [0, 0.25, 0.5] });
    sections.forEach(s => obs.observe(s));
  }

  document.getElementById('langBtn').addEventListener('click', () => {
    lang = lang === 'zh' ? 'en' : 'zh';
    render();
  });

  render();
})();
</script>
</body>
</html>
